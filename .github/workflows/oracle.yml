# Captures ground-truth traces from the real Minecraft server.
#
# The server jar is downloaded from Mojang on each run and checked against
# the manifest's SHA-1. It is never committed or published; only the traces
# (our own output) are uploaded as an artifact.
name: oracle

on:
  pull_request:
    paths:
      - harness/**
      - fixtures/**
      - crates/**
      - tools/**
      - data/**
      - .github/workflows/oracle.yml
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: Capture only fixtures whose file name contains this
        required: false
      commit_data:
        description: Commit regenerated registry data to the branch
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      MC_VERSION: "26.3"
      REPORTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: harness/work/server-*.jar
          key: server-jar-${{ env.MC_VERSION }}
      - name: Capture traces
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            harness/run.sh --only "${{ inputs.only }}"
          else
            harness/run.sh
          fi
      - name: Print unrotated traces
        if: always()
        run: |
          for t in harness/work/traces/*@r0.json; do
            echo "::group::$(basename "$t" .json)"
            jq -c '{initial: .initial | length, levels}, (.entries[] | [.tick, .phase, .kind, .pos, (.state // .detail)])' "$t"
            echo "::endgroup::"
          done
      - name: Registry data is current
        if: ${{ !inputs.commit_data }}
        run: |
          git add -N data
          if git ls-files --error-unmatch "data/$MC_VERSION" >/dev/null 2>&1; then
            git diff --exit-code --stat -- data
          else
            echo "::warning::data/$MC_VERSION is not committed yet; run this workflow with commit_data"
            head -c 2000 "data/$MC_VERSION/blocks.json"
          fi
      - name: Commit registry data
        if: ${{ inputs.commit_data }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Regenerate $MC_VERSION registry data from the game's reports"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traces-${{ env.MC_VERSION }}
          path: harness/work/traces/
          if-no-files-found: ignore
