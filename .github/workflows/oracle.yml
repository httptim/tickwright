# Captures ground-truth traces from the real Minecraft server.
#
# The server jar is downloaded from Mojang on each run and checked against
# the manifest's SHA-1. It is never committed or published; only the traces
# (our own output) are uploaded as an artifact.
name: oracle

on:
  pull_request:
    paths:
      - harness/**
      - fixtures/**
      - crates/**
      - tools/**
      - data/**
      - .github/workflows/oracle.yml
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: Capture only fixtures whose file name contains this
        required: false
      commit_data:
        description: Commit regenerated registry data and traces to the branch
        type: boolean
        default: false

permissions:
  contents: write

env:
  MC_VERSION: "26.3"
  # The JVM the server runs on, pinned so a new release in the runner's tool
  # cache can't change it, or give the two jobs different ones. Math.sin and
  # Math.cos depend on it: rerun the kick-trig job's check after changing it.
  JAVA_VERSION: "25.0.4+1"

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      REPORTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: harness/work/server-*.jar
          key: server-jar-${{ env.MC_VERSION }}
      - name: Machine
        run: |
          lscpu | grep '^Model name'
          java -version
      - name: Capture traces
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            harness/run.sh --only "${{ inputs.only }}"
          else
            harness/run.sh
          fi
      - name: Print unrotated traces
        if: always()
        run: |
          for t in harness/work/traces/{torch_inverter,repeater_lock,piston_push,sticky_piston_pulse_1}@r0.json; do
            [ -f "$t" ] || continue
            echo "::group::$(basename "$t" .json)"
            jq -c '{initial: .initial | length, levels}, (.entries[] | [.tick, .phase, .kind, .pos, (.state // .detail)])' "$t"
            echo "::endgroup::"
          done
      - name: Committed ground truth is current
        if: ${{ !inputs.commit_data && !inputs.only }}
        run: |
          if [ -z "$(git ls-tree --name-only HEAD "data/$MC_VERSION")" ]; then
            echo "::warning::data/$MC_VERSION is not committed yet; run this workflow with commit_data"
            exit 0
          fi
          # Fails if the game's output changed, or if a capture is not deterministic.
          git add -N data traces
          git diff --exit-code --stat -- data traces
      - name: Commit ground truth
        if: ${{ inputs.commit_data && !inputs.only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data traces
          git diff --cached --quiet || git commit -m "Regenerate $MC_VERSION registry data and traces from the game"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traces-${{ env.MC_VERSION }}
          path: harness/work/traces/
          if-no-files-found: ignore
      - name: Capture summary
        if: always()
        run: |
          log=harness/work/capture.log
          [ -f "$log" ] || exit 0
          grep -E '^(agent patched|Minecraft|entries by|captured|block writes)' "$log" || true
          grep -E 'tick [0-9]+: entity [0-9]+' "$log" | head -200 || true
          grep -A 25 -m 3 ' FAILED: ' "$log" || true
          du -sh harness/work/traces || true
      - name: Explain a failed capture
        if: failure()
        run: |
          log=harness/work/capture.log
          [ -f "$log" ] || exit 0
          # Annotations can be read through the API when the log can't.
          python3 - "$log" <<'PY'
          import sys
          lines = open(sys.argv[1], errors="replace").read().splitlines()
          def note(chunk):
              print("::error::" + "%0A".join(l.replace("%", "%25") for l in chunk))
          failed = [i for i, l in enumerate(lines) if " FAILED: " in l][:5]
          for i in failed:
              note(lines[i : i + 12])
          if not failed:
              note(lines[-15:])
          PY

  # Newly primed TNT kicks at a random angle through Math.sin and Math.cos,
  # whose last bit depends on the JVM and the CPU. Measures how many of a
  # million kick angles per seed this runner's JVM, interpreted and compiled,
  # works out differently from the engine. It reports, and fails only if the
  # check itself can't run.
  kick-trig:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: harness/work/server-*.jar
          key: server-jar-${{ env.MC_VERSION }}
      - name: Measure Math.sin and Math.cos against the engine
        run: harness/kick-trig.sh
      - name: Kick trigonometry summary
        if: always()
        run: |
          out=harness/work/kick-trig
          [ -f "$out/summary.txt" ] || exit 0
          cpu="$(lscpu | grep '^Model name' | tr -s ' ')"
          note="Differences are expected until the engine has a bit-exact version: crate::math is correctly rounded, and HotSpot on x86-64 is an ulp away on about 1 kick angle in 400."
          {
            echo "### Kick trigonometry"
            echo
            echo "$note"
            echo
            echo '```'
            echo "$cpu"
            cat "$out/summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Annotations can be read through the API when the log can't.
          echo "::notice::$cpu%0A$(sed ':a;N;$!ba;s/\n/%0A/g' "$out/summary.txt")%0A$note"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kick-trig-${{ env.MC_VERSION }}
          path: |
            harness/work/kick-trig/diffs.tsv
            harness/work/kick-trig/summary.txt
            harness/work/kick-trig/*.log
          if-no-files-found: ignore
