# Captures ground-truth traces from the real Minecraft server.
#
# The server jar is downloaded from Mojang on each run and checked against
# the manifest's SHA-1. It is never committed or published; only the traces
# (our own output) are uploaded as an artifact.
name: oracle

on:
  pull_request:
    paths:
      - harness/**
      - fixtures/**
      - crates/**
      - .github/workflows/oracle.yml
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: Capture only fixtures whose file name contains this
        required: false

jobs:
  capture:
    runs-on: ubuntu-latest
    env:
      MC_VERSION: "26.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: harness/work/server-*.jar
          key: server-jar-${{ env.MC_VERSION }}
      - name: Capture traces
        run: |
          if [ -n "${{ inputs.only }}" ]; then
            harness/run.sh --only "${{ inputs.only }}"
          else
            harness/run.sh
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traces-${{ env.MC_VERSION }}
          path: harness/work/traces/
          if-no-files-found: ignore
