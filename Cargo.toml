[workspace]
resolver = "3"
members = ["crates/trace", "crates/engine", "crates/schematic", "crates/materials", "crates/cli", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/httptim/tickwright"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
clap = { version = "4", features = ["derive"] }
flate2 = "1"
